name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets -j 2
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - run: ./scripts/Package.ps1
