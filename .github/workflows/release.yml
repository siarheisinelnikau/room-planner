name: Publish RoomPlanner
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: room-planner-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report release progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: 'pending',
              context: 'RoomPlanner release', description: 'Building and verifying Windows release',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run synthetic regression tests
        run: cargo test --locked --all-targets -j 2
      - name: Run static analysis
        run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - name: Build and verify portable package
        run: ./scripts/Package.ps1
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Release.ps1
      - name: Report release result
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha,
              state: process.env.RELEASE_RESULT === 'success' ? 'success' : 'failure',
              context: 'RoomPlanner release', description: `Release job ${process.env.RELEASE_RESULT}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
