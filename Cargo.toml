[package]
name = "room-planner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/siarheisinelnikau/room-planner"
build = "build.rs"

[dependencies]
egui = "=0.33.3"
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "accesskit"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "1.0"
ureq = { version = "=3.5.0", features = ["json"] }
rfd = "=0.15.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

